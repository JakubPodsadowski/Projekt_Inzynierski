warehouse:
  scheduler:
    tick-interval-ms: 1000
  simulation:
    tick-interval-ms: 1000
    simulated-minutes-per-tick: 1
    start-time: "06:00"
    break-poll-ms: 500
    work-interval-seconds-min: 45
    work-interval-seconds-max: 90
    throughput-random-min: 0.85
    throughput-random-max: 1.15
    order-generate-interval-ms: 4000
    max-open-pick-orders: 25
    inbound-generate-interval-ms: 4000
    max-open-putaway-receipts: 20
  breaks:
    first-shift:
      first-break-start: "09:00"
      first-break-end: "09:30"
      second-break-start: "12:00"
      second-break-end: "12:30"
    second-shift:
      first-break-start: "09:30"
      first-break-end: "10:00"
      second-break-start: "12:30"
      second-break-end: "13:00"
  relocation:
    max-moves-per-tick: 2
    max-moves-into-department-per-tick: 1
    balance-tolerance-iph: 15.0
    cooldown-minutes: 45
    max-relocations-per-day: 4
    travel-minutes: 5
    top-performer-sample-size: 3
    allow-fallback-from-least-deficit: true
  demand:
    min-required-iph-when-backlog: 40.0
    min-putaway-staff-when-free-capacity: 2.0
  packing:
    max-stations: 8
  performance:
    default-iph:
      PICKING: 85
      PACKING: 220
      PUTAWAY: 55
  seeding:
    employee-count: 40
  kafka:
    consumer-group-id: warehouse-analytics-group-demo

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.podsadowski.warehouse.domain.dto"

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka: warn
    com.podsadowski.warehouse.kafka: warn
