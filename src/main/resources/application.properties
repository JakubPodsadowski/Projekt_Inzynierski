spring.datasource.url=jdbc:postgresql://localhost:5433/warehouse_db
spring.datasource.username=admin
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false

spring.application.name=warehouse

spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

warehouse.scheduler.tick-interval-ms=10000
warehouse.scheduler.work-log-purge-interval-ms=60000
warehouse.kafka.progress-topic=warehouse-progress
warehouse.kafka.consumer-group-id=warehouse-analytics-group
