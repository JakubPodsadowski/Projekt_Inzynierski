<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="simulation-control-bar border-bottom bg-light px-3 py-2 d-none" id="simulation-panel"
     data-demo-only
     th:fragment="simulationPanel">
    <div class="d-flex flex-wrap align-items-center justify-content-between">
        <div class="d-flex align-items-center mr-3 mb-1 mb-md-0">
            <i class="fas fa-clock text-primary mr-2"></i>
            <span class="font-weight-bold" id="sim-clock">—</span>
            <span class="badge badge-secondary ml-2" id="sim-state-badge">—</span>
        </div>

        <div class="d-flex flex-wrap align-items-center">
            <div class="d-flex align-items-center mr-3 mb-1 mb-md-0" style="min-width: 180px;">
                <label for="sim-speed" class="mb-0 mr-2 text-sm text-muted">Speed</label>
                <input type="range" class="custom-range" id="sim-speed" min="1" max="100" step="1" value="1"/>
                <span class="ml-2 text-sm font-weight-bold" id="sim-speed-label">1x</span>
            </div>

            <button type="button" class="btn btn-sm btn-success mr-2 mb-1 mb-md-0" id="sim-play-btn">
                <i class="fas fa-play"></i> Resume
            </button>
            <button type="button" class="btn btn-sm btn-warning mr-2 mb-1 mb-md-0" id="sim-pause-btn">
                <i class="fas fa-pause"></i> Pause
            </button>

            <div class="btn-group mb-1 mb-md-0" role="group">
                <button type="button" class="btn btn-sm btn-outline-danger" id="sim-chaos-500"
                        title="Add 500 items to each active employee order">
                    Chaos +500
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" id="sim-chaos-1000"
                        title="Add 1000 items to each active employee order">
                    +1000
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
