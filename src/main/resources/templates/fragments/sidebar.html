<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="main-sidebar sidebar-dark-primary elevation-4" th:fragment="sidebar(activeMenu)">
    <a th:href="@{/}" class="brand-link">
        <i class="fas fa-warehouse brand-logo-icon"></i>
        <span class="brand-text font-weight-light">Warehouse</span>
    </a>

    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link"
                       th:classappend="${activeMenu == 'overview'} ? 'active'">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Overview</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/departments}" class="nav-link"
                       th:classappend="${activeMenu == 'departments'} ? 'active'">
                        <i class="nav-icon fas fa-building"></i>
                        <p>Departments</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/employees}" class="nav-link"
                       th:classappend="${activeMenu == 'employees'} ? 'active'">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Employees</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/relocations}" class="nav-link"
                       th:classappend="${activeMenu == 'relocations'} ? 'active'">
                        <i class="nav-icon fas fa-exchange-alt"></i>
                        <p>Relocations</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>
</body>
</html>
