<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section})}">
<head>
    <title>Employees</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-2">
        <p class="text-muted mb-0">Workforce roster. Open an employee for activity timeline and relocation history.</p>
        <span id="employees-loading" class="badge badge-secondary d-none">Refreshing…</span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title mb-0">Employees</h3>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>IPH</th>
                        <th>Break</th>
                        <th>Status</th>
                        <th>Items left</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="employees-body">
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">Loading…</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/js/employees.js}"></script>
</section>
</body>
</html>
